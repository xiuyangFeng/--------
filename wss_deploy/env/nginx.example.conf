# wss_deploy 反向代理示例（nginx 终结 TLS，v0.15）。仓库不会安装或引用本文件：复制后按实际域名 / 证书修改。
#
# 服务侧必须同时设置（写入 service.json，见 wss_deploy/env/README.md §4）：
#   PYTHONPATH=. python -m wss_deploy.cli service restart --host 127.0.0.1 --env WSS_DEPLOY_TRUST_PROXY=1
# - 只监听 127.0.0.1：外部只能经 nginx 访问；
# - WSS_DEPLOY_TRUST_PROXY=1：只信任来自回环地址（即本机 nginx）的 X-Forwarded-For / -Proto / -Host，
#   并强制共享模式（需要登录；users.json 必须已有启用用户）——否则经代理的请求都来自 127.0.0.1，会落进免登录的本机模式；
# - WSS_DEPLOY_COOKIE_SECURE 默认 auto：nginx 报 https 时会话 Cookie 带 Secure，并由服务自己发
#   Strict-Transport-Security: max-age=31536000（不含 includeSubDomains / preload），这里不要再加一份。

server {
    listen 80;
    server_name wss.example.lab;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wss.example.lab;

    ssl_certificate     /etc/nginx/tls/wss.example.lab.crt;
    ssl_certificate_key /etc/nginx/tls/wss.example.lab.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:wss_tls:10m;
    ssl_session_timeout 1d;

    # 上传上限与服务对齐：单个 STL ≤ 128 MiB，批量 ≤ 256 MiB（另加 64 KiB 表单开销）；一页纸配图 JSON ≤ 24 MiB。
    client_max_body_size 257m;
    client_body_timeout  300s;
    # 请求体直接流给服务（服务自己分段落盘并计 sha256；nginx 再缓冲一遍只多一次拷贝）。
    proxy_request_buffering off;

    # 共同的转发头。Host / X-Forwarded-Host 用 $http_host（带端口）：浏览器的 Origin 带非默认端口，
    # 用 $host 会丢端口，所有写操作将因「请求来源与当前服务不一致」被拒。
    # X-Forwarded-For 用 $remote_addr 覆盖（不接力客户端自带的链）；服务取最右一个非回环地址作为客户端 IP。
    # 若前面还有一层负载均衡，改用 $proxy_add_x_forwarded_for 并让负载均衡覆盖该头（服务只信任回环一跳）。
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_read_timeout 300s;     # 打包下载（服务先在磁盘上建 zip，≤ 2 GiB）与大报告
        proxy_send_timeout 300s;
    }

    # 事件流（SSE）：关闭缓冲、长读超时（服务每 15 s 发保活，单条流最长 1 h 后由浏览器自动重连）。
    location ~ ^/api/(events|jobs/[A-Za-z0-9_-]+/events)$ {
        proxy_pass http://127.0.0.1:8765;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
    }
}
