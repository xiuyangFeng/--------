<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>并排比较 · WSS 工作台</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/workbench_core.js" defer></script>
  <script src="/static/compare.js" defer></script>
</head>
<body class="compare-body">
  <header class="topbar">
    <a class="brand" href="/" aria-label="返回工作台"><span class="brand-mark" aria-hidden="true">W</span><span>WSS <span class="brand-sub">并排比较</span></span></a>
    <div class="compare-tools">
      <label class="compare-sync"><input type="checkbox" id="sync-camera" checked>同步视角</label>
      <label class="compare-sync"><input type="checkbox" id="sync-display" checked>同步显示口径</label>
      <button type="button" class="text-button" id="push-left" title="把左侧的物理量、色标、阈值等显示口径应用到右侧">以左为准</button>
      <button type="button" class="text-button" id="push-right" title="把右侧的显示口径应用到左侧">以右为准</button>
      <button type="button" class="text-button" id="swap-sides">左右互换</button>
      <span class="connection" id="connection" role="status">正在连接服务…</span>
    </div>
  </header>
  <div id="notice" class="notice" role="alert" hidden></div>
  <main class="compare-main">
    <section class="card compare-summary" id="compare-summary" aria-live="polite">
      <details id="compare-table-wrap"><summary>标量比较（仅比较声明一致的统计，差值 = 右 − 左）<span class="compare-summary-hint">· 两侧报告已按半宽自动切到紧凑布局，报告头部「完整布局」可切回 · 视角联动在解剖坐标架下进行，不做点对点配准</span></summary>
        <div class="comparison-identities"><div class="comparison-identity" id="identity-left"><strong>左侧</strong><span>—</span></div><div class="comparison-identity" id="identity-right"><strong>右侧</strong><span>—</span></div></div>
        <div id="compare-table"></div></details>
    </section>
    <section class="compare-frames">
      <div class="compare-pane"><div class="compare-pane-head" id="head-left">左侧</div><iframe id="frame-left" title="左侧报告" referrerpolicy="no-referrer"></iframe></div>
      <div class="compare-pane"><div class="compare-pane-head" id="head-right">右侧</div><iframe id="frame-right" title="右侧报告" referrerpolicy="no-referrer"></iframe></div>
    </section>
  </main>
</body>
</html>
