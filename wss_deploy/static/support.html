<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>用户工单 · WSS 工作台</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/ops.css"><script src="/static/support.js" defer></script></head>
<body class="ops-body support-body">
  <header class="topbar ops-topbar"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">W</span><span>WSS <span class="brand-sub">用户工单</span></span></a><div class="topbar-tools"><span id="support-actor" class="ops-actor"></span><button id="support-logout" class="text-button" type="button" hidden>退出</button><a href="/" class="text-button ops-back">返回工作台</a></div></header>
  <div id="support-notice" class="notice" role="alert" hidden></div>
  <main class="ops-main">
    <section class="ops-heading"><div><p class="eyebrow">Support · 用户反馈</p><h1>工单与反馈</h1><p class="help">提交问题并查看处理进度，可关联自己提交的任务。</p></div><span id="support-refresh-state" class="help" role="status"></span></section>
    <section id="support-login" class="card ops-login" hidden><h2>登录工单系统</h2><form id="support-login-form"><label id="support-mode-wrap">登录方式<select id="support-mode"><option value="password">账号与口令</option><option value="token">访问令牌</option></select></label><div id="support-user-fields"><label>用户名<input id="support-username" autocomplete="username" maxlength="64"></label><label>口令<input id="support-password" type="password" autocomplete="current-password"></label></div><label id="support-token-wrap" hidden>访问令牌<input id="support-token" type="password" autocomplete="current-password"></label><p id="support-login-error" class="ops-error" role="alert" hidden></p><button id="support-login-submit" type="submit" class="primary">登录</button></form></section>
    <div id="support-content" class="ops-content" hidden>
      <div class="ops-columns support-columns">
        <section class="card ops-panel"><h2>提交新工单</h2><form id="support-create" class="support-create"><label>主题<input id="support-title" maxlength="200" required placeholder="简要描述问题"></label><label>问题描述<textarea id="support-description" rows="6" maxlength="4000" required placeholder="请描述操作步骤、预期结果和实际问题。"></textarea></label><label>关联任务 ID（可选）<input id="support-job" maxlength="80" placeholder="填写自己提交的任务 ID"></label><label>优先级<select id="support-priority"><option value="normal">普通</option><option value="high">高</option><option value="urgent">紧急</option></select></label><button id="support-create-submit" type="submit" class="primary">提交工单</button></form></section>
        <section class="card ops-panel"><div class="section-head"><h2>我的工单</h2><button id="support-refresh" type="button" class="text-button">刷新</button></div><form id="support-filter" class="ops-filter support-filter"><label><span>关键词</span><input id="support-query" maxlength="200" type="search" placeholder="主题、任务或工单 ID"></label><label><span>状态</span><select id="support-status"><option value="">全部</option><option value="open">待处理</option><option value="in_progress">处理中</option><option value="resolved">已解决</option><option value="closed">已关闭</option></select></label><button type="submit">筛选</button></form><div class="table-wrap"><table class="ops-table"><thead><tr><th>主题</th><th>状态</th><th>更新时间</th></tr></thead><tbody id="support-rows"><tr><td colspan="3" class="ops-empty">暂无工单</td></tr></tbody></table></div><div class="ops-pager"><button id="support-prev" type="button" disabled>上一页</button><span id="support-page">—</span><button id="support-next" type="button" disabled>下一页</button></div><aside id="support-detail" class="ticket-detail"><p class="help">选择工单查看回复。</p></aside></section>
      </div>
    </div>
  </main><noscript><p class="notice error">工单系统需要启用 JavaScript。</p></noscript>
</body></html>
